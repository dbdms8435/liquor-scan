<style>
:root { --ink: #1E1E1E; --muted: #56655C; --line: #D3DDD6; --bg: #EEF3EF; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { margin: 0 0 6px; font-size: 24px; color: #17251F; }
p.lead { margin: 0 0 18px; color: var(--muted); max-width: 70ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 10px; break-inside: avoid; }
.card.new { border: 2px dashed #E3A13B; }
figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
figcaption b { font-size: 18px; }
figcaption span { color: var(--muted); font-size: 14px; }
svg { display: block; width: 100%; height: auto; }
@media print {
  body { background: #fff; }
  main { padding: 0; }
  .grid { grid-template-columns: 1fr 1fr; }
  .card { border-color: #999; }
}
</style>
